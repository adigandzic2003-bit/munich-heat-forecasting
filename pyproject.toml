[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "munich-heat-forecasting"
version = "0.1.0"
description = "Reproducible DWD weather forecasting and heat-event evaluation in Munich"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<24",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

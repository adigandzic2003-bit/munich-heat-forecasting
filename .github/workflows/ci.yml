name: Python quality assurance
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'pyproject.toml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Offline demo (after final stage)
        if: ${{ hashFiles('src/heat_forecasting/pipeline.py') != '' }}
        run: python -m heat_forecasting.pipeline --config configs/default.yaml --demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-outputs
          path: outputs/
          retention-days: 7

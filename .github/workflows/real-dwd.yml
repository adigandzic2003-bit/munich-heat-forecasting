name: Run real DWD evaluation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Download historical archives and evaluate
        run: python -m heat_forecasting.pipeline --config configs/default.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dwd-real-evaluation
          path: outputs/
          retention-days: 14
